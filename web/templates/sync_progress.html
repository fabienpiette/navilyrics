{{define "title"}}navilyrics — syncing…{{end}}

{{define "content"}}
<h2>Sync lyrics gaps</h2>

<div class="stats-grid" id="sync-summary" style="margin-bottom:1.5rem">
    <div class="stat-cell"><div class="stat-num" id="cnt-synced-lrc">—</div><div class="stat-label">wrote .lrc</div></div>
    <div class="stat-cell"><div class="stat-num" id="cnt-synced-embedded">—</div><div class="stat-label">wrote embedded</div></div>
    <div class="stat-cell"><div class="stat-num" id="cnt-skipped">—</div><div class="stat-label">skipped</div></div>
    <div class="stat-cell"><div class="stat-num" id="cnt-errors">—</div><div class="stat-label">errors</div></div>
</div>

<div class="run-log-toolbar" id="sync-toolbar" style="display:none">
    <div class="filter-pills">
        <button class="filter-pill active" data-status="synced_lrc"      onclick="toggleFilter(this,'sync-log')">wrote .lrc</button>
        <button class="filter-pill active" data-status="synced_embedded" onclick="toggleFilter(this,'sync-log')">wrote embedded</button>
        <button class="filter-pill active" data-status="skipped"         onclick="toggleFilter(this,'sync-log')">skipped</button>
        <button class="filter-pill active" data-status="error"           onclick="toggleFilter(this,'sync-log')">errors</button>
    </div>
    <button class="btn secondary small" onclick="exportCSV('sync-log','sync_results.csv')">Export CSV</button>
</div>

<div class="run-log"
     hx-ext="sse"
     sse-connect="/sync/{{.RunID}}/events"
     id="sync-log">
    <div sse-swap="result" hx-swap="afterbegin" id="sync-log-inner"></div>
    <div sse-swap="done" hx-swap="none" id="sync-done-trigger"></div>
</div>

<div class="form-actions" style="margin-top:1rem">
    <a href="/" class="btn secondary" title="Back to library overview">Dashboard</a>
    <a href="/songs" class="btn secondary" title="Browse songs">Songs</a>
    <button class="btn secondary" id="btn-scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="display:none" title="Scroll to top">↑ Top</button>
</div>

<script>
function toggleFilter(pill, logId) {
    document.getElementById(logId).classList.toggle('hide-' + pill.dataset.status);
    pill.classList.toggle('active');
}

function exportCSV(logId, filename) {
    var rows = [['status','artist','title','error']];
    document.getElementById(logId).querySelectorAll('.run-log-line[data-status]').forEach(function(el) {
        rows.push([el.dataset.status||'', el.dataset.artist||'', el.dataset.title||'', el.dataset.err||'']);
    });
    var csv = rows.map(function(r) {
        return r.map(function(v) { return '"' + v.replace(/"/g,'""') + '"'; }).join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

document.addEventListener('htmx:sseMessage', function(e) {
    if (e.detail.type === 'result') {
        document.getElementById('btn-scroll-top').style.display = '';
        document.getElementById('sync-toolbar').style.display = 'flex';
    }
    if (e.detail.type === 'done') {
        try {
            var d = JSON.parse(e.detail.data);
            document.getElementById('cnt-synced-lrc').textContent      = d.synced_lrc;
            document.getElementById('cnt-synced-embedded').textContent = d.synced_embedded;
            document.getElementById('cnt-skipped').textContent         = d.skipped;
            document.getElementById('cnt-errors').textContent          = d.errors;
        } catch(ex) {}
    }
});
</script>
{{end}}
