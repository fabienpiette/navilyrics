<div class="stats-grid" id="stats-grid">
    <div class="stat-cell">
        <div class="stat-num">{{if .Ready}}{{.Total}}{{else}}—{{end}}</div>
        <div class="stat-label">total songs</div>
    </div>
    <div class="stat-cell">
        <div class="stat-num">{{if .Ready}}{{.HasLyrics}}{{else}}—{{end}}</div>
        <div class="stat-label">with lyrics</div>
    </div>
    <div class="stat-cell">
        <div class="stat-num">{{if .Ready}}{{.Missing}}{{else}}—{{end}}</div>
        <div class="stat-label">missing</div>
    </div>
    <div class="stat-cell">
        <div class="stat-num">{{if .Ready}}{{.Pct}}%{{else}}—{{end}}</div>
        <div class="stat-label">coverage</div>
    </div>
</div>
