{{define "songs_rows_body"}}
{{range .Songs}}
<tr class="song-row"
    onclick="previewSong('{{.ID}}', this)"
    data-title="{{.Title}}"
    data-artist="{{.Artist}}"
    data-album="{{.Album}}">
  <td>{{.Title}}</td>
  <td class="muted">{{.Artist}}</td>
  <td class="muted">{{.Album}}</td>
  <td>
    {{if .HasLyrics}}<span class="badge badge-found">yes</span>
    {{else}}<span class="badge badge-not_found">missing</span>{{end}}
  </td>
</tr>
{{else}}
<tr><td colspan="4" class="empty">No songs found.</td></tr>
{{end}}
{{if .HasMore}}
<tr hx-get="/songs/rows"
    hx-trigger="intersect once"
    hx-swap="outerHTML"
    hx-target="this"
    hx-include="#songs-controls"
    hx-vals='{"start": "{{.NextStart}}"}'>
  <td colspan="4" style="height:4px;padding:0;"></td>
</tr>
{{end}}
{{end}}
{{template "songs_rows_body" .}}
