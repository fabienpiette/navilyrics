services:
  navilyrics:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NAVIDROME_URL: ${NAVIDROME_URL}
      NAVIDROME_USER: ${NAVIDROME_USER}
      NAVIDROME_PASS: ${NAVIDROME_PASS}
      MUSIC_DIR: /music-clean:/music-data
      DRY_RUN: ${DRY_RUN:-false}
      GOSCRIBE_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - music-clean:/music-clean
      - music-data:/music-data

volumes:
  music-clean:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.1.49,rw,noatime,nfsvers=4"
      device: ":/music-clean"
  music-data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.1.49,rw,noatime,nfsvers=4"
      device: ":/music-data"