services:
  navilyrics:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NAVIDROME_URL: ${NAVIDROME_URL}
      NAVIDROME_USER: ${NAVIDROME_USER}
      NAVIDROME_PASS: ${NAVIDROME_PASS}
      MUSIC_DIR: /music
      DRY_RUN: ${DRY_RUN:-false}
    volumes:
      - ${MUSIC_DIR}:/music
